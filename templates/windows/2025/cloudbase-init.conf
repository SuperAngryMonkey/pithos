[DEFAULT]
username=pithos
groups=Administrators
inject_user_password=true
first_logon_behaviour=no

# Proxmox defaults citype to configdrive2 for Windows guests (drive label
# "config-2"), so ConfigDriveService is first; NoCloud kept as a fallback.
metadata_services=cloudbaseinit.metadata.services.configdrive.ConfigDriveService,cloudbaseinit.metadata.services.nocloudservice.NoCloudConfigDriveService

# Order matters: hostname and password first, user-data last so the tailscale
# join runs against a fully configured machine.
plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,
        cloudbaseinit.plugins.windows.createuser.CreateUserPlugin,
        cloudbaseinit.plugins.common.setuserpassword.SetUserPasswordPlugin,
        cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,
        cloudbaseinit.plugins.common.userdata.UserDataPlugin


allow_reboot=false
stop_service_on_exit=false

logdir=C:\Windows\Temp\
logfile=cloudbase-init.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN
verbose=true

mtu_use_dhcp_config=true
ntp_use_dhcp_config=true
local_scripts_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\LocalScripts\

[config_drive]
# Proxmox attaches the cloud-init drive as an ISO on a CD-ROM. The old
# DEFAULT/config_drive_* keys are deprecated and ignored by 1.1.x.
types=iso
locations=cdrom
